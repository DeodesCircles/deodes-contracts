[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Pinned: highest solc the Arc testnet explorer supports for verification.
solc_version = "0.8.36"
# V1 era (UNIFIED-PLAN 1.2 decision): optimizer on from Factory genesis.
# V0 shipped unoptimized (see GAS-SNAPSHOT.md §1 historical table); V0 is
# frozen on-chain so this only affects local builds and V1 deployments.
# .gas-snapshot tracks THIS config — compare against GAS-SNAPSHOT.md §4.
optimizer = true
optimizer_runs = 200
# V1-era vectors (1.6) are machine-checked by tests via vm.readFile; allow
# exactly that directory and nothing else.
fs_permissions = [{ access = "read", path = "./test/vectors/" }, { access = "read", path = "./out/" }]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
